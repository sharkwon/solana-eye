name: refresh-report

# Re-generates the report every hour (and on demand) and publishes it to
# GitHub Pages via the /docs folder. This is the "auto-updating" story:
# no server needed — CI is the cron.

on:
  schedule:
    - cron: "17 * * * *"   # hourly, offset so we don't collide with the top of the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect + render
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: |
          python run.py

      - name: Publish to /docs (GitHub Pages root)
        run: |
          mkdir -p docs
          cp outputs/dashboard.html docs/index.html
          cp outputs/latest.json docs/latest.json
          cp outputs/report.md docs/report.md
          cp outputs/history.jsonl docs/history.jsonl

      - name: Commit
        run: |
          git config user.name "solana-pulse bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "report: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
